
; Seeed XIAO ESP32-C3 — ATO Water System

[platformio]
default_envs = seeed_xiao_esp32c3   ; BEZ tego `pio run` bez -e budowałoby też env OTA

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino

; Partition scheme — dwa sloty app (OTA); huge_app.csv (1 slot) blokuje OTA (abort w esp_flash_erase_region)
board_build.partitions = min_spiffs.csv

; Flash settings
board_build.flash_mode = dio
board_build.f_flash = 80000000L

; Upload & Monitor
monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -Isrc/config
    -Isrc/hardware
    -Isrc/algorithm
    -Isrc/web
    -Isrc/core
    -Isrc/network
    -Isrc/security
    -Isrc/crypto
    -Isrc/provisioning
    -DOTA_PASSWORD=\"${sysenv.OTA_PASSWORD}\"

lib_deps =
    Wire
    mathieucarbou/AsyncTCP@^3.2.14
    mathieucarbou/ESPAsyncWebServer@^3.3.23
    bblanchon/ArduinoJson@^7.4.2
    adafruit/RTClib@^2.1.1
    adafruit/Adafruit FRAM I2C

[env:seeed_xiao_esp32c3_ota]
extends = env:seeed_xiao_esp32c3
upload_protocol = espota
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}
    --host_port=8266


