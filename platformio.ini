
; Seeed XIAO ESP32-C3 — ATO Water System

[platformio]
default_envs = seeed_xiao_esp32c3   ; WITHOUT this, `pio run` without -e would also build the OTA env

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino

; Partition scheme — two app slots (OTA); huge_app.csv (1 slot) blocks OTA (abort in esp_flash_erase_region)
board_build.partitions = min_spiffs.csv

; Flash settings
board_build.flash_mode = dio
board_build.f_flash = 80000000L

; Upload & Monitor
monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -Isrc/config
    -Isrc/hardware
    -Isrc/algorithm
    -Isrc/web
    -Isrc/core
    -Isrc/network
    -Isrc/security
    -Isrc/crypto
    -Isrc/provisioning

; OTA password: scripts/ota_secret.py reads the variable of this name (shared
; ~/.secrets/iot.env, named after the device IP) and generates ota_secret.h + --auth
; for espota. Not via ${sysenv} — it would change project.checksum (full rebuild).
; Upload (USB or OTA) without the variable is aborted.
custom_ota_password_var = OTA_PASSWORD_192_168_10_2
extra_scripts = pre:scripts/ota_secret.py

lib_deps =
    Wire
    mathieucarbou/AsyncTCP@^3.2.14
    mathieucarbou/ESPAsyncWebServer@^3.3.23
    bblanchon/ArduinoJson@^7.4.2
    adafruit/RTClib@^2.1.1
    adafruit/Adafruit FRAM I2C
    pololu/VL53L4CD@^1.0.0

[env:seeed_xiao_esp32c3_ota]
extends = env:seeed_xiao_esp32c3
upload_protocol = espota
upload_port = 192.168.10.2
upload_flags =
    --host_port=8266          ; fixed return port (firewall rule); --auth added by the script


